name: CI / Docker Hub

# Every push: run backend tests, build both images, push them to Docker Hub.
#   tags: sha-<short>, <branch>; pushes to the default branch also update :latest.
# Pull requests: test + build only (nothing is pushed).
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so only the newest commit's images land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend-a/requirements.txt
            backend-a/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  images:
    name: Image (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend-a
            image: achilles-backend
          - name: frontend
            context: frontend
            image: achilles-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'achilles' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      # The frontend build runs `next build`, so type errors fail CI here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Pushes to main (or a manual run) deploy the exact images just built to the Vultr server.
  deploy:
    name: Deploy to Vultr
    needs: images
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          HOST: ${{ secrets.VULTR_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          USER: ${{ secrets.VULTR_USER }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$USER@$HOST:/opt/achilles/docker-compose.yml"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd /opt/achilles \
            && ACHILLES_TAG=$TAG docker compose pull \
            && ACHILLES_TAG=$TAG docker compose up -d --remove-orphans \
            && docker image prune -f"

      - name: Health check
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          USER: ${{ secrets.VULTR_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd /opt/achilles && docker compose ps --format '{{.Name}} {{.Health}}'" | tee /dev/stderr | grep -q 'frontend.*healthy'; then
              exit 0
            fi
            sleep 5
          done
          echo "frontend did not become healthy"; exit 1
